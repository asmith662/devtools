[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtools"
version = "0.1.0"
description = "Composable developer-tool primitives for Python callers and AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devtools"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=devtools",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
markers = [
    "live_codex: opt-in test that contacts the locally authenticated Codex CLI",
]

[tool.coverage.run]
branch = true
source = ["devtools"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src"]
